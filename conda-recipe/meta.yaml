{% set name = "reconcils" %}
{% set version = "1.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.9
    - pandas
    - matplotlib-base
    - python-igraph
    - biopython
    - ete3
    - rich

test:
  imports:
    - reconcILS
    - reconcILS.validation
    - reconcILS.reconcILS_validate
    - reconcILS.rich_display
    - reconcILS.copy_labels
  commands:
    - reconcils --help
  requires:
    - pip

about:
  home: https://github.com/smishra677/reconcILS
  license: MIT
  license_file: LICENSE
  summary: Gene tree-species tree reconciliation with deterministic species-copy labels

extra:
  recipe-maintainers: []
